# Релиз по тегу v*: бинари для macOS и Linux без cgo (sqlite — modernc, чистый
# Go), архивы и контрольные суммы прикладываются к GitHub Release. Именно их
# скачивает install.sh — пользователю Go не нужен.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          name="orchestra-tennant_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags "-s -w -X github.com/realkasparov/orchestra-tennant/executor.Version=${GITHUB_REF_NAME#v}" \
            -o "dist/$name/orchestra-tennant" ./cmd/orchestra-tennant
          tar -C "dist/$name" -czf "dist/$name.tar.gz" orchestra-tennant
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt
      # install.sh прикладывается к релизу: адрес
      # releases/latest/download/install.sh стабилен и не зависит от ветки.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            install.sh
          generate_release_notes: true
